# yaml-language-server: $schema=https://raw.githubusercontent.com/northcutted/clearcutt-verify/main/contract/trust-policy.v1.schema.json
# Whose signatures the clearcutt-showcase showcase accepts, and for what (plan §4). One
# file, read by clearcutt-factory (signing.trustPolicy in the shared profile,
# org/profile.yaml, which every repository extends, this one by path) and by
# clearcutt-verify (the showcase repository's estate/policy.yaml), so
# building, rebasing, and verifying the estate trust the same signers.
#
# Images are signed inside factory's reusable workflows (images.yml when
# built, fleet.yml when rebased), which anyone can call, so each signer also
# names the one repository whose runs count (sourceRepository), requires the
# image to name that repository as its source (sourceMatchesImage: its
# org.opencontainers.image.source label), and requires the run to be on main.
# One signer per repository, never the whole owner: northcutted may own other
# repositories that call the same workflows.
apiVersion: clearcutt.dev/v1
kind: TrustPolicy
signers:
  - name: platform-images
    roles: [image]
    identityRegexp: ^https://github\.com/northcutted/clearcutt-factory/\.github/workflows/(images|fleet|reattest)\.yml@refs/tags/v\d+\.\d+\.\d+$
    issuer: https://token.actions.githubusercontent.com
    sourceRepository: https://github.com/northcutted/clearcutt-showcase-platform
    sourceMatchesImage: true
    sourceRef: refs/heads/main
  - name: checkout-images
    roles: [image]
    identityRegexp: ^https://github\.com/northcutted/clearcutt-factory/\.github/workflows/(images|fleet|reattest)\.yml@refs/tags/v\d+\.\d+\.\d+$
    issuer: https://token.actions.githubusercontent.com
    sourceRepository: https://github.com/northcutted/clearcutt-showcase-checkout
    sourceMatchesImage: true
    sourceRef: refs/heads/main
  - name: catalog-images
    roles: [image]
    identityRegexp: ^https://github\.com/northcutted/clearcutt-factory/\.github/workflows/(images|fleet|reattest)\.yml@refs/tags/v\d+\.\d+\.\d+$
    issuer: https://token.actions.githubusercontent.com
    sourceRepository: https://github.com/northcutted/clearcutt-showcase-catalog
    sourceMatchesImage: true
    sourceRef: refs/heads/main
  - name: storefront-images
    roles: [image]
    identityRegexp: ^https://github\.com/northcutted/clearcutt-factory/\.github/workflows/(images|fleet|reattest)\.yml@refs/tags/v\d+\.\d+\.\d+$
    issuer: https://token.actions.githubusercontent.com
    sourceRepository: https://github.com/northcutted/clearcutt-showcase-storefront
    sourceMatchesImage: true
    sourceRef: refs/heads/main
  # Stacks: only the platform's own stacks workflow, on main.
  - name: platform-stacks
    roles: [stack]
    identity: https://github.com/northcutted/clearcutt-showcase-platform/.github/workflows/stacks.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  # Estate history bundles are trusted independently of image evidence.
  - name: estate-report
    roles: [estate]
    identity: https://github.com/northcutted/clearcutt-showcase/.github/workflows/estate.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
